version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: polar_twin_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=polar_twin

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: polar_twin_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polar_twin_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/polar_twin
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - JWT_SECRET=polar_twin_jwt_sih_secret_key_antarctica_2024
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - mosquitto

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polar_twin_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongodb_data:
